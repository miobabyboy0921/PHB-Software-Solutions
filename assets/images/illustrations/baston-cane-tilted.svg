<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400"><defs><linearGradient id="cg-grip" x1="0" x2="1"><stop offset="0" stop-color="#1E1E24"/><stop offset=".45" stop-color="#3A3F55"/><stop offset="1" stop-color="#16161B"/></linearGradient>
    <linearGradient id="cg-metal" x1="0" x2="1"><stop offset="0" stop-color="#9A9DAA"/><stop offset=".4" stop-color="#F5F5F7"/><stop offset="1" stop-color="#A5A8B4"/></linearGradient>
    <linearGradient id="cg-case" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3F55"/><stop offset="1" stop-color="#2D3142"/></linearGradient>
    <linearGradient id="cg-foot" x1="0" x2="1"><stop offset="0" stop-color="#A61C2C"/><stop offset=".45" stop-color="#E63946"/><stop offset="1" stop-color="#A61C2C"/></linearGradient>
    <radialGradient id="cg-pod"><stop offset="0" stop-color="#E63946" stop-opacity=".55"/><stop offset="1" stop-color="#E63946" stop-opacity="0"/></radialGradient>
    <marker id="cm-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#F28A93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="cm-ah2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#9A9DAA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <symbol id="cane-art" viewBox="20 0 170 690">
<!-- swing / tilt indicator -->
  <path d="M62 40 Q100 10 138 40" fill="none" stroke="#F28A93" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" marker-start="url(#cm-ah)" marker-end="url(#cm-ah)"/>

  <!-- handle -->
  <rect x="81" y="48" width="38" height="122" rx="19" fill="url(#cg-grip)"/>
  <g stroke="#5E6275" stroke-width="2" stroke-linecap="round"><path d="M89 66H111M89 75H111M89 84H111M89 93H111M89 102H111"/></g>
  <!-- vibration motor (inside handle) -->
  <circle cx="100" cy="138" r="10" fill="#1E1E24" stroke="#E63946" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="100" cy="138" r="4" fill="#E63946"/>
  <g fill="none" stroke="#E63946" stroke-width="2.2" stroke-linecap="round">
    <path d="M127 128a14 14 0 0 1 0 20"/><path d="M135 121a24 24 0 0 1 0 34" stroke-opacity=".5"/>
    <path d="M73 128a14 14 0 0 0 0 20"/><path d="M65 121a24 24 0 0 0 0 34" stroke-opacity=".5"/>
  </g>
  <rect x="86" y="168" width="28" height="9" rx="3" fill="#5E6275"/>

  <!-- upper shaft -->
  <rect x="93" y="176" width="14" height="330" rx="3" fill="url(#cg-metal)"/>

  <!-- buttons -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="700" text-anchor="middle">
    <circle cx="100" cy="200" r="8" fill="#E63946" stroke="#1E1E24" stroke-width="1.5"/><text x="100" y="203.5" fill="#16161B">1</text>
    <circle cx="100" cy="224" r="8" fill="#E63946" stroke="#1E1E24" stroke-width="1.5"/><text x="100" y="227.5" fill="#16161B">2</text>
    <circle cx="100" cy="248" r="8" fill="#E63946" stroke="#1E1E24" stroke-width="1.5"/><text x="100" y="251.5" fill="#16161B">3</text>
  </g>

  <!-- casing + switch -->
  <rect x="64" y="282" width="72" height="92" rx="14" fill="url(#cg-case)" stroke="#555A6B" stroke-width="1.5"/>
  <g stroke="#8E93A6" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"><path d="M78 348H122M78 356H122M78 364H110"/></g>
  <rect x="80" y="298" width="22" height="22" rx="4" fill="none" stroke="#8E93A6" stroke-opacity=".7" stroke-width="1.5"/>
  <g stroke="#8E93A6" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round"><path d="M85 294v4M91 294v4M97 294v4M85 320v4M91 320v4M97 320v4"/></g>
  <rect x="108" y="300" width="16" height="26" rx="3" fill="none" stroke="#8E93A6" stroke-opacity=".7" stroke-width="1.5"/>
  <rect x="113" y="297" width="6" height="3" rx="1" fill="#8E93A6" fill-opacity=".7"/>
  <rect x="111" y="316" width="10" height="7" rx="1.5" fill="#E63946" fill-opacity=".8"/>
  <rect x="112" y="272" width="22" height="11" rx="5.5" fill="#E63946"/>
  <circle cx="128" cy="277.5" r="3.6" fill="#16161B"/>

  <!-- echo waves -->
  <g fill="none" stroke="#E63946" stroke-width="2.2" stroke-linecap="round">
    <path d="M89 396a16 16 0 0 1 22 0"/><path d="M83 387a26 26 0 0 1 34 0" stroke-opacity=".5"/>
    <path d="M160 428a16 16 0 0 1 0 24"/><path d="M169 421a26 26 0 0 1 0 38" stroke-opacity=".5"/>
    <path d="M40 428a16 16 0 0 0 0 24"/><path d="M31 421a26 26 0 0 0 0 38" stroke-opacity=".5"/>
    <path d="M89 484a16 16 0 0 0 22 0"/><path d="M83 493a26 26 0 0 0 34 0" stroke-opacity=".5"/>
  </g>
  <!-- sensor hub -->
  <path d="M100 440L100 412M100 440L72 440M100 440L128 440M100 440L100 468" stroke="#5E6275" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="440" r="16" fill="#2D3142" stroke="#C8CAD3" stroke-width="2"/>
  <g>
    <circle cx="100" cy="412" r="18" fill="url(#cg-pod)"/><circle cx="100" cy="412" r="12" fill="#1E1E24" stroke="#E63946" stroke-width="2"/><circle cx="100" cy="412" r="5.5" fill="#E63946" fill-opacity=".45"/><circle cx="100" cy="412" r="2.2" fill="#E63946"/>
    <circle cx="68" cy="440" r="18" fill="url(#cg-pod)"/><circle cx="68" cy="440" r="12" fill="#1E1E24" stroke="#E63946" stroke-width="2"/><circle cx="68" cy="440" r="5.5" fill="#E63946" fill-opacity=".45"/><circle cx="68" cy="440" r="2.2" fill="#E63946"/>
    <circle cx="132" cy="440" r="18" fill="url(#cg-pod)"/><circle cx="132" cy="440" r="12" fill="#1E1E24" stroke="#E63946" stroke-width="2"/><circle cx="132" cy="440" r="5.5" fill="#E63946" fill-opacity=".45"/><circle cx="132" cy="440" r="2.2" fill="#E63946"/>
    <circle cx="100" cy="468" r="18" fill="url(#cg-pod)"/><circle cx="100" cy="468" r="12" fill="#1E1E24" stroke="#E63946" stroke-width="2"/><circle cx="100" cy="468" r="5.5" fill="#E63946" fill-opacity=".45"/><circle cx="100" cy="468" r="2.2" fill="#E63946"/>
  </g>

  <!-- lock collar + adjustable footer -->
  <rect x="88" y="504" width="24" height="14" rx="4" fill="#C8CAD3"/>
  <path d="M92 511H108" stroke="#7D8192" stroke-width="1.5"/>
  <rect x="96" y="518" width="8" height="144" rx="4" fill="url(#cg-foot)"/>
  <g stroke="#16161B" stroke-opacity=".35" stroke-width="1"><path d="M96 540h8M96 560h8M96 580h8M96 600h8M96 620h8"/></g>
  <rect x="93" y="658" width="14" height="20" rx="6" fill="#1E1E24"/>
  <path d="M74 530V650" stroke="#9A9DAA" stroke-width="1.8" stroke-linecap="round" marker-start="url(#cm-ah2)" marker-end="url(#cm-ah2)"/>

      </symbol></defs><use href="#cane-art" x="185.4" y="-62.2" width="129.2" height="524.4" transform="rotate(-52 250 200)"/></svg>
