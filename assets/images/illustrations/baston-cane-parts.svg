            <title id="diagram-title">Parts of the BASTON smart cane</title>
            <desc id="diagram-desc">A straight cane shown from the front. From top to bottom: a rubber handle that the user can swing side to side, tilt or slant, with a vibration motor inside; buttons 1, 2 and 3 for changing the detection range; a microcontroller and battery casing with an on/off power switch; a sensor hub with front, left, right and bottom ultrasonic sensors; and an adjustable footer at the bottom.</desc>
            <path d="M30 680 H190" stroke="#4A4E60" stroke-width="2" stroke-linecap="round" fill="none"/>
            <use href="#cane-art" x="20" y="0" width="170" height="690"/>
            <!-- leaders -->
  <g stroke="#5E6275" stroke-width="1.2" fill="none">
    <path d="M122 84H200"/>
    <path d="M112 138H122M143 138H200"/>
    <path d="M114 196H118V252H114M118 224H200"/>
    <path d="M136 277H200"/>
    <path d="M138 328H200"/>
    <path d="M114 404L140 392H200"/>
    <path d="M178 440H200"/>
    <path d="M114 474L140 488H200"/>
    <path d="M106 590H200"/>
  </g>
  <g fill="#F28A93"><circle cx="200" cy="84" r="3"/><circle cx="200" cy="138" r="3"/><circle cx="200" cy="224" r="3"/><circle cx="200" cy="277" r="3"/><circle cx="200" cy="328" r="3"/><circle cx="200" cy="392" r="3"/><circle cx="200" cy="440" r="3"/><circle cx="200" cy="488" r="3"/><circle cx="200" cy="590" r="3"/></g>

  
            <g font-family="'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif">
<text x="212" y="83" font-size="18" font-weight="700" fill="#F5F5F7">Rubber handle</text><text x="212" y="102" font-size="15" fill="#B0B3BE">Swing, tilt or slant</text>
<text x="212" y="137" font-size="18" font-weight="700" fill="#F5F5F7">Vibration motor</text><text x="212" y="156" font-size="15" fill="#B0B3BE">Felt through the handle</text>
<text x="212" y="223" font-size="18" font-weight="700" fill="#F5F5F7">Buttons 1–3</text><text x="212" y="242" font-size="15" fill="#B0B3BE">Change detection range</text>
<text x="212" y="276" font-size="18" font-weight="700" fill="#F5F5F7">Power switch</text><text x="212" y="295" font-size="15" fill="#B0B3BE">On / off</text>
<text x="212" y="327" font-size="18" font-weight="700" fill="#F5F5F7">Microcontroller</text><text x="212" y="346" font-size="15" fill="#B0B3BE">and battery casing</text>
<text x="212" y="397" font-size="18" font-weight="700" fill="#F5F5F7">Front sensor</text>
<text x="212" y="445" font-size="18" font-weight="700" fill="#F5F5F7">Left + right sensors</text>
<text x="212" y="493" font-size="18" font-weight="700" fill="#F5F5F7">Bottom sensor</text>
<text x="212" y="589" font-size="18" font-weight="700" fill="#F5F5F7">Adjustable footer</text><text x="212" y="608" font-size="15" fill="#B0B3BE">Length set to preference</text>
            </g>
          </svg>
