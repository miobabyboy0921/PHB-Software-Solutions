    <circle cx="100" cy="200" r="8" fill="#E63946" stroke="#1E1E24" stroke-width="1.5"/><text x="100" y="203.5" fill="#16161B">1</text>
    <circle cx="100" cy="224" r="8" fill="#E63946" stroke="#1E1E24" stroke-width="1.5"/><text x="100" y="227.5" fill="#16161B">2</text>
    <circle cx="100" cy="248" r="8" fill="#E63946" stroke="#1E1E24" stroke-width="1.5"/><text x="100" y="251.5" fill="#16161B">3</text>
  </g>

  <!-- casing + switch -->
  <rect x="64" y="282" width="72" height="92" rx="14" fill="url(#cg-case)" stroke="#555A6B" stroke-width="1.5"/>
  <g stroke="#8E93A6" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"><path d="M78 348H122M78 356H122M78 364H110"/></g>
  <rect x="80" y="298" width="22" height="22" rx="4" fill="none" stroke="#8E93A6" stroke-opacity=".7" stroke-width="1.5"/>
  <g stroke="#8E93A6" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round"><path d="M85 294v4M91 294v4M97 294v4M85 320v4M91 320v4M97 320v4"/></g>
  <rect x="108" y="300" width="16" height="26" rx="3" fill="none" stroke="#8E93A6" stroke-opacity=".7" stroke-width="1.5"/>
